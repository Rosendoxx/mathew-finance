# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:mathew}
quarkus.datasource.password=${POSTGRES_PASSWORD:mathew}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mathew_finance}

# Hibernate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Server
quarkus.http.port=${QUARKUS_HTTP_PORT:8081}

# Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
